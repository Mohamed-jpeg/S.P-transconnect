<!DOCTYPE html>
<html>
<head>
    <title>Delete account</title>
</head>
<body>
    <h2>Delete your account?</h2>
    <p>This permanently deletes your account and cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete my account</button>
        <a href="{% url 'entreprise:profile' %}">Cancel</a>
    </form>
</body>
</html>
